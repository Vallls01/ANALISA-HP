  <main>
    <h1>Hubungi Kami</h1>
    <p>Sudah cek gejalanya tapi masih bingung? Ceritakan keluhan HP Anda lewat form ini, dan pesannya akan langsung terbuka di WhatsApp.</p>

    <p>
      Alamat: Palang - Tuban <br>
      Jam buka: 09.00 - 21.00
    </p>

    <form id="formKontak" novalidate>
      <label for="nama">Nama</label>
      <input type="text" id="nama" name="nama" autocomplete="name">

      <label for="hp">Tipe HP</label>
      <input type="text" id="hp" name="hp" placeholder="Contoh: Samsung A12">

      <label for="pesan">Keluhan</label>
      <textarea id="pesan" name="pesan" rows="4" placeholder="Ceritakan gejala yang dialami HP Anda"></textarea>

      <button type="submit">Kirim lewat WhatsApp</button>
      <p id="info" role="alert"></p>
    </form>
  </main>
